<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Dashboard - Annadan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-100 min-h-screen">

    <header class="bg-white shadow-lg border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <img src="https://via.placeholder.com/40x40.png?text=NGO" alt="Annadan Logo" class="w-10 h-10 rounded-full border-2 border-purple-200">
                <div>
                    <h1 class="text-xl font-bold text-gray-800">NGO Dashboard</h1>
                    <p class="text-sm text-gray-600">Helping Communities</p>
                </div>
            </div>
            <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition duration-200 flex items-center space-x-2">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <button id="add-request-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-medium transition duration-200 flex items-center space-x-2 shadow-lg">
                <i class="fas fa-plus-circle"></i>
                <span>Add New Request</span>
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-6 border border-gray-200">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">My Active Requests</h2>
            <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
                <div class="bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl p-6 border border-purple-200">
                    <div class="mb-4">
                        <h4 class="text-xl font-semibold text-gray-800 mb-3">Need 20 kg Rice</h4>
                        <div class="space-y-2">
                            <p class="flex items-center text-gray-700">
                                <i class="fas fa-tags text-purple-500 mr-3 w-4"></i>
                                <span class="font-medium">Type:</span>
                                <span class="ml-2">Staples</span>
                            </p>
                            <p class="flex items-center text-gray-700">
                                <i class="fas fa-box text-blue-500 mr-3 w-4"></i>
                                <span class="font-medium">Quantity:</span>
                                <span class="ml-2">20 kg</span>
                            </p>
                            <p class="flex items-center text-gray-700">
                                <i class="fas fa-clock text-red-500 mr-3 w-4"></i>
                                <span class="font-medium">Deadline:</span>
                                <span class="ml-2">Today, 4 PM</span>
                            </p>
                            <p class="flex items-center text-gray-700">
                                <i class="fas fa-user-circle text-green-500 mr-3 w-4"></i>
                                <span class="font-medium">Posted by:</span>
                                <span class="ml-2">Majorda Community Kitchen</span>
                            </p>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2 px-3 rounded-lg text-sm font-medium transition duration-200">
                            Edit
                        </button>
                        <button class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2 px-3 rounded-lg text-sm font-medium transition duration-200">
                            Close
                        </button>
                    </div>
                </div>
            </div>
            <p class="no-requests-message text-center text-gray-500 py-8" style="display: none;">
                <i class="fas fa-clipboard-list text-gray-300 text-4xl mb-2 block"></i>
                You currently have no active requests. Post one now!
            </p>
        </div>
    </main>

    <div id="request-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Post a Plea</h2>
                <button class="close-btn text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <form id="request-form" class="space-y-4">
                <div>
                    <label for="request-title" class="block text-sm font-medium text-gray-700 mb-1">Request Title / Item Needed:</label>
                    <input type="text" id="request-title" placeholder="e.g., Need 20 kg Rice" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                </div>

                <div>
                    <label for="food-type" class="block text-sm font-medium text-gray-700 mb-1">Food Type / Category:</label>
                    <select id="food-type" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                        <option value="">Select a category</option>
                        <option value="Produce">Produce</option>
                        <option value="Prepared">Prepared Food</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Staples">Staples</option>
                        <option value="Dairy">Dairy</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div>
                    <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">Quantity / Portions:</label>
                    <input type="text" id="quantity" placeholder="e.g., 20 kg or 50 meals" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                </div>

                <div>
                    <label for="deadline" class="block text-sm font-medium text-gray-700 mb-1">Urgency / Deadline:</label>
                    <input type="datetime-local" id="deadline" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                </div>

                <div>
                    <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Notes / Instructions (Optional):</label>
                    <textarea id="notes" placeholder="e.g., Must be cooked within 24 hours" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500"></textarea>
                </div>

                <div>
                    <label for="preference" class="block text-sm font-medium text-gray-700 mb-1">Pickup / Delivery Preference (Optional):</label>
                    <input type="text" id="preference" placeholder="e.g., volunteer pickup or self-collection" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                </div>

                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 px-4 rounded-lg font-medium transition duration-200">Post Request</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('request-modal');
        const btn = document.getElementById('add-request-btn');
        const closeBtn = document.querySelector('.close-btn');

        btn.onclick = function() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        closeBtn.onclick = function() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        const form = document.getElementById('request-form');
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Request posted! (This is a demo)');
            form.reset();
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });
    </script>
</body>
