<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Sign-Up - Annadan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Business Owner Sign Up</h1>
        <p class="aim">Register your business to start donating surplus food.</p>
        
        <form>
            <div style="margin-bottom: 16px;">
                <label for="business-name">Business Name:</label>
                <input type="text" id="business-name" name="business-name" required>
            </div>

            <div style="margin-bottom: 16px;">
                <label for="contact-person">Contact Person:</label>
                <input type="text" id="contact-person" name="contact-person" required>
            </div>

            <div style="margin-bottom: 16px;">
                <label for="business-type">Business Type:</label>
                <input type="text" id="business-type" name="business-type" placeholder="e.g., Restaurant, Grocery Store" required>
            </div>

            <div style="margin-bottom: 16px;">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div style="margin-bottom: 16px;">
                <label for="address">Address:</label>
                <textarea id="address" name="address" required></textarea>
            </div>

            <div style="margin-bottom: 16px;">
                <label for="fssai-license">FSSAI License Number:</label>
                <input type="text" id="fssai-license" name="fssai-license" required>
            </div>

            <button type="submit">Register Business</button>
        </form>
    </div>
</body>
</html>
